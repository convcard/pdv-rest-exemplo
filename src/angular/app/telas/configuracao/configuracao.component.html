<app-tela-tef titulo="Configurações">
  <div class="grade-campos" style="grid-template-columns: 170px 1fr">
    <label>Ambiente:</label>
    <input value="Homologação (aut-h.convcard.com.br)" readonly tabindex="-1" />

    <label>Token da loja:</label>
    <input placeholder="01c760b2-a9db-429c-ad60-d926f49878cd" cdkFocusInitial [(ngModel)]="identificadorLoja" />

    <label>Nome da loja:</label>
    <input maxlength="40" [(ngModel)]="nomeLoja" />

    <label>Enviar dados receita:</label>
    <select [(ngModel)]="usaReceita">
      <option [ngValue]="true">SIM</option>
      <option [ngValue]="false">NÃO</option>
    </select>

    <label>Enviar número nota:</label>
    <select [(ngModel)]="usaNumNota">
      <option [ngValue]="true">SIM</option>
      <option [ngValue]="false">NÃO</option>
    </select>

    <label>Enviar itens da venda:</label>
    <select [(ngModel)]="enviaItens">
      <option [ngValue]="true">SIM</option>
      <option [ngValue]="false">NÃO</option>
    </select>

    <label>Certificado (.crt):</label>
    <span class="linha">
      <input readonly tabindex="-1" placeholder="Nenhum arquivo selecionado" [value]="arquivoCertificado()" [title]="caminhoCertificado()" />
      <button title="Selecionar o certificado .crt" (click)="selecionarCertificado()"><app-icone nome="pasta" />Selecionar</button>
    </span>

    <label>Chave privada (.key):</label>
    <span class="linha">
      <input readonly tabindex="-1" placeholder="Nenhum arquivo selecionado" [value]="arquivoChave()" [title]="caminhoChave()" />
      <button title="Selecionar a chave .key" (click)="selecionarChave()"><app-icone nome="pasta" />Selecionar</button>
    </span>

    <label>Nome do software:</label>
    <input maxlength="40" [(ngModel)]="nomeSoftware" />

    <label>Versão do software:</label>
    <input maxlength="20" [(ngModel)]="versaoSoftware" />
  </div>

  <div class="botoes centro">
    <button class="primario" (click)="salvarEFechar()"><app-icone nome="salvar" />Salvar<kbd>F2</kbd></button>
    <button (click)="validar()"><app-icone nome="validar" />Validar configuração<kbd>F3</kbd></button>
    <button (click)="fechar()"><app-icone nome="sair" />Sair<kbd>Esc</kbd></button>
  </div>
</app-tela-tef>
