<app-tela-tef titulo="Atualização de endereço">
  <div class="faixa-titulo">
    Atualização do endereço postal<br />
    Favor confirmar os dados abaixo com o usuário do cartão
  </div>

  <div class="grade-campos" style="grid-template-columns: 110px 1fr 70px 160px">
    <label>CEP:</label>
    <span class="linha">
      <input appMascara="cep" [(ngModel)]="cep" (keydown.enter)="buscarCep()" cdkFocusInitial />
      <button class="so-icone" tabindex="-1" title="Buscar CEP" (click)="buscarCep()"><app-icone nome="pesquisar" /></button>
    </span>
    <span></span><span></span>

    <label>Logradouro:</label>
    <input class="span3" appMascara="maiusculas" [tamanho]="40" [(ngModel)]="logradouro" />

    <label>Complemento:</label>
    <input appMascara="maiusculas" [tamanho]="20" [(ngModel)]="complemento" />
    <label>Número:</label>
    <input appMascara="maiusculas" [tamanho]="10" [(ngModel)]="numero" />

    <label>Bairro:</label>
    <input class="span3" appMascara="maiusculas" [tamanho]="25" [(ngModel)]="bairro" />

    <label>Cidade:</label>
    <input appMascara="maiusculas" [tamanho]="25" [(ngModel)]="cidade" />
    <label>UF:</label>
    <select [(ngModel)]="estado">
      <option value=""></option>
      @for (uf of ufs; track uf) {
        <option [value]="uf">{{ uf }}</option>
      }
    </select>
  </div>

  <div class="botoes centro">
    <button class="primario" (click)="confirmar()"><app-icone nome="confirmar" />Confirmar<kbd>F2</kbd></button>
  </div>
</app-tela-tef>
